---
# tasks file for roles/vscode

- name: Instalar dependencias para VS Code
  ansible.builtin.apt:
    name:
      - wget
      - gpg
      - apt-transport-https
    state: present
    update_cache: true

- name: Descargar clave GPG de Microsoft
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /tmp/microsoft.asc
    mode: '0644'

- name: Crear keyring de Microsoft
  ansible.builtin.shell:
    cmd: >
      gpg --dearmor < /tmp/microsoft.asc
      > /usr/share/keyrings/microsoft.gpg
    creates: /usr/share/keyrings/microsoft.gpg

- name: Configurar repositorio de Visual Studio Code
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/vscode.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: https://packages.microsoft.com/repos/code
      Suites: stable
      Components: main
      Architectures: amd64
      Signed-By: /usr/share/keyrings/microsoft.gpg

- name: Instalar Visual Studio Code
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true

- name: Eliminar clave temporal
  ansible.builtin.file:
    path: /tmp/microsoft.asc
    state: absent

- name: Comprobar version de Visual Studio Code
  ansible.builtin.command:
    cmd: dpkg-query -W -f='${Version}\n' code
  register: vscode_version
  changed_when: false

- name: Mostrar version de Visual Studio Code
  ansible.builtin.debug:
    var: vscode_version.stdout
