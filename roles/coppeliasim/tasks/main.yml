---
# tasks file for roles/coppeliasim
- name: Instalar dependencias de CoppeliaSim
  ansible.builtin.apt:
    name:
      - xz-utils
      - libgl1
      - libglu1-mesa
      - libxcb-xinerama0
      - libxkbcommon-x11-0
      - libdbus-1-3
      - libfontconfig1
      - libxrender1
      - libxi6
      - libxext6
    state: present
    update_cache: true

- name: Descargar CoppeliaSim Edu en el controlador
  ansible.builtin.get_url:
    url: https://downloads.coppeliarobotics.com/V4_10_0_rev0/CoppeliaSim_Edu_V4_10_0_rev0_Ubuntu22_04.tar.xz
    dest: "{{ role_path }}/files/CoppeliaSim_Edu_V4_10_0_rev0_Ubuntu22_04.tar.xz"
    mode: '0644'
  delegate_to: localhost
  run_once: true
  become: false

- name: Crear directorio de instalacion de CoppeliaSim
  ansible.builtin.file:
    path: /opt/coppeliasim
    state: directory
    mode: '0755'

- name: Copiar CoppeliaSim a los clientes
  ansible.builtin.copy:
    src: CoppeliaSim_Edu_V4_10_0_rev0_Ubuntu22_04.tar.xz
    dest: /tmp/coppeliasim.tar.xz
    mode: '0644'

- name: Descomprimir CoppeliaSim
  ansible.builtin.unarchive:
    src: /tmp/coppeliasim.tar.xz
    dest: /opt/coppeliasim
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: /opt/coppeliasim/coppeliaSim

- name: Crear enlace ejecutable de CoppeliaSim
  ansible.builtin.file:
    src: /opt/coppeliasim/coppeliaSim.sh
    dest: /usr/local/bin/coppeliasim
    state: link

- name: Crear lanzador de CoppeliaSim
  ansible.builtin.copy:
    dest: /usr/share/applications/coppeliasim.desktop
    mode: '0644'
    content: |
      [Desktop Entry]
      Name=CoppeliaSim Edu
      Comment=Robot Simulation Environment
      Exec=/opt/coppeliasim/coppeliaSim.sh
      Terminal=false
      Type=Application
      Categories=Education;Development;Science;

- name: Eliminar archivo temporal de CoppeliaSim
  ansible.builtin.file:
    path: /tmp/coppeliasim.tar.xz
    state: absent

- name: Comprobar instalacion de CoppeliaSim
  ansible.builtin.stat:
    path: /opt/coppeliasim/coppeliaSim
  register: coppeliasim_binary

- name: Verificar que CoppeliaSim esta instalado
  ansible.builtin.assert:
    that:
      - coppeliasim_binary.stat.exists
      - coppeliasim_binary.stat.executable
    fail_msg: "CoppeliaSim no se ha instalado correctamente"

- name: Mostrar resultado de instalacion
  ansible.builtin.debug:
    msg: "CoppeliaSim Edu V4.10.0 rev0 instalado correctamente"
