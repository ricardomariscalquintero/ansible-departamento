---
# tasks file for roles/pencil
- name: Descargar OpenPencil en el controlador
  ansible.builtin.get_url:
    url: https://github.com/open-pencil/open-pencil/releases/download/v0.13.2/OpenPencil_0.13.2_amd64.deb
    dest: "{{ role_path }}/files/OpenPencil_0.13.2_amd64.deb"
    mode: '0644'
  delegate_to: localhost
  run_once: true
  become: false

- name: Copiar OpenPencil a los clientes
  ansible.builtin.copy:
    src: OpenPencil_0.13.2_amd64.deb
    dest: /tmp/OpenPencil_0.13.2_amd64.deb
    mode: '0644'

- name: Instalar OpenPencil
  ansible.builtin.apt:
    deb: /tmp/OpenPencil_0.13.2_amd64.deb
    state: present

- name: Eliminar instalador temporal de OpenPencil
  ansible.builtin.file:
    path: /tmp/OpenPencil_0.13.2_amd64.deb
    state: absent

- name: Comprobar version de OpenPencil
  ansible.builtin.command:
    cmd: dpkg-query -W -f='${Version}' open-pencil
  register: pencil_version
  changed_when: false

- name: Mostrar version de OpenPencil
  ansible.builtin.debug:
    var: pencil_version.stdout

- name: Comprobar ejecutable de OpenPencil
  ansible.builtin.command:
    cmd: test -x /usr/bin/OpenPencil
  changed_when: false
