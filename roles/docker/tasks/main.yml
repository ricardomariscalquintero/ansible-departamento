---
# tasks file for roles/docker

- name: Instalar dependencias para Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Crear directorio para keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Descargar clave GPG de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /tmp/docker.asc
    mode: '0644'

- name: Convertir clave GPG de Docker
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg /tmp/docker.asc
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Configurar repositorio oficial de Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    mode: '0644'
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable

- name: Actualizar cache APT
  ansible.builtin.apt:
    update_cache: true

- name: Instalar Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Habilitar y arrancar Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Eliminar clave temporal
  ansible.builtin.file:
    path: /tmp/docker.asc
    state: absent

- name: Comprobar version de Docker
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version
  changed_when: false

- name: Mostrar version de Docker
  ansible.builtin.debug:
    var: docker_version.stdout
