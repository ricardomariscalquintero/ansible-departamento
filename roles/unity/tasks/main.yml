---
# ============================================================
# Unity Hub
# ============================================================

- name: Instalar dependencias necesarias
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present


# ============================================================
# Limpiar configuraciones anteriores de Unity
# ============================================================

- name: Eliminar repositorio antiguo Unity Hub sources
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/unityhub.sources
    state: absent

- name: Eliminar repositorio Unity Hub anterior
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/unityhub.list
    state: absent

- name: Eliminar keyring antiguo de Unity
  ansible.builtin.file:
    path: /usr/share/keyrings/Unity_Technologies_ApS.gpg
    state: absent

- name: Eliminar keyring Unity generado anteriormente
  ansible.builtin.file:
    path: /etc/apt/keyrings/unityhub.gpg
    state: absent


# ============================================================
# Configurar clave oficial
# ============================================================

- name: Crear directorio de keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Descargar clave publica de Unity
  ansible.builtin.get_url:
    url: https://hub.unity3d.com/linux/keys/public
    dest: /tmp/unityhub-public.key
    mode: '0644'

- name: Convertir clave publica de Unity a keyring GPG
  ansible.builtin.command:
    cmd: >
      gpg --dearmor --yes
      -o /etc/apt/keyrings/unityhub.gpg
      /tmp/unityhub-public.key

- name: Dar permisos de lectura al keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings/unityhub.gpg
    owner: root
    group: root
    mode: '0644'


# ============================================================
# Configurar repositorio oficial
# ============================================================

- name: Configurar repositorio oficial de Unity Hub
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/unityhub.list
    mode: '0644'
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main


# ============================================================
# Actualizar e instalar
# ============================================================

- name: Actualizar cache APT
  ansible.builtin.apt:
    update_cache: true

- name: Instalar Unity Hub
  ansible.builtin.apt:
    name: unityhub
    state: present


# ============================================================
# Limpieza
# ============================================================

- name: Eliminar clave temporal
  ansible.builtin.file:
    path: /tmp/unityhub-public.key
    state: absent


# ============================================================
# Comprobacion
# ============================================================

- name: Comprobar Unity Hub instalado
  ansible.builtin.command:
    cmd: dpkg-query -W -f='${Status} ${Version}\n' unityhub
  register: unity_version
  changed_when: false

- name: Mostrar version de Unity Hub
  ansible.builtin.debug:
    var: unity_version.stdout
