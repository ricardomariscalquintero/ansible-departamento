---
- name: Actualizar cache de APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instalar paquetes basicos
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - nano
      - htop
      - net-tools
      - dnsutils
      - unzip
      - p7zip-full
      - python3
      - python3-pip
      - openssh-server
    state: present
    update_cache: true
    
- name: Configurar hostname completo del equipo
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}.iesfernandoaguilar.es"

- name: Configurar entrada 127.0.1.1 en /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ inventory_hostname }}.iesfernandoaguilar.es"
    state: present
